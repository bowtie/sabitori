[package]
name = "sabitori"
version = "0.3.0"
edition = "2021"
description = "Tray utility that filters mouse wheel events for Windows, with a direction-lock mode that suppresses spurious opposite-direction scrolls"
keywords = ["windows", "tray", "mouse", "wheel", "scroll"]
categories = ["gui", "os::windows-apis", "hardware-support"]

[dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Dwm",
] }
tray-icon = { version = "0.24", default-features = false, features = [
    "common-controls-v6",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Version matches gpui 0.2.2's, so `Window::window_handle()` (used to reach
# the native HWND for WS_EX_TOPMOST) resolves against the same trait impl.
raw-window-handle = "0.6"

# GPUI: disable Linux-only backends, keep Windows support
gpui = { version = "0.2", default-features = false, features = [
    "font-kit",
    "windows-manifest",
] }
gpui-component = "0.5.1"

[build-dependencies]
resvg = "0.45.1"
usvg = "0.45.1"
ico = "0.5.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
